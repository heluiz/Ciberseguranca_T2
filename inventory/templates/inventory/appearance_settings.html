<details class="appearance-settings">
  <summary aria-label="Configurações de aparência"
           title="Configurações de aparência">
    <svg class="icon" aria-hidden="true">
      <use href="/static/inventory/icons.svg#settings" />
    </svg>
  </summary>
  <section class="appearance-panel" aria-label="Aparência">
    <h2>Aparência</h2>
    <div class="theme-switcher">
      <label for="theme-select">Tema de cores</label>
      <select id="theme-select" aria-describedby="theme-help">
        <option value="neon">Ciano e roxo</option>
        <option value="sniper">Verde neon</option>
        <option value="ninjatrader">Verde escuro</option>
        <option value="campo">Verde suave e âmbar</option>
      </select>
      <p id="theme-help">Preferência salva neste navegador.</p>
      <span id="theme-status" class="sr-only" role="status"></span>
    </div>
  </section>
</details>
