# Menu de terminal do Trabalho 2, no seu computador:
#   docker compose up -d --build
# Depois, para usar o menu: docker attach trab02_2026_2_12621cbs200_terminal
# (para sair sem parar o programa: Ctrl+P e depois Ctrl+Q)
# Nomes no padrão da disciplina (card S5_20): trab02_2026_2_MATRICULA. Sem
# porta publicada: o programa só é usado pelo terminal. No servidor, use
# compose.servidor.yaml, que sobe este mesmo menu junto com a versão web.
name: trab02_2026_2_12621cbs200
services:
  terminal:
    build: .
    image: trab02_2026_2_12621cbs200_terminal:1.0
    # A imagem é construída aqui: não tentar baixá-la do Docker Hub antes.
    pull_policy: build
    container_name: trab02_2026_2_12621cbs200_terminal
    # O processo principal é um menu: precisa de entrada aberta (-i) e de
    # terminal (-t), senão input() recebe fim de entrada e o programa
    # termina na hora.
    stdin_open: true
    tty: true
    # Religa se o programa cair ou o servidor reiniciar, a não ser que
    # alguém tenha parado de propósito (docker stop).
    restart: unless-stopped
    # Endurecimento (CIS Docker Benchmark): o sistema de arquivos do
    # container é só leitura, menos o volume de dados, e nenhum
    # processo pode ganhar privilégio além do que já tem.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 50
    # Os dados sobrevivem ao container: ficam neste volume.
    volumes:
      - terminal-data:/app/dados

volumes:
  terminal-data:
    # Nome fixo, o mesmo usado com "docker run" e no servidor.
    name: trab02_2026_2_12621cbs200_terminal_data
