# Verificação estática de tipos (card S5_01): python -m mypy
# O domínio (classes, inventário, risco, armazenamento e migração) é
# conferido. As telas do terminal (main, telas, arvore) e a atualização
# de CVE ainda não estão anotadas: ficam fora, registradas como dívida
# técnica em docs/DIVIDA-TECNICA.md.
[mypy]
python_version = 3.12
files = classificacoes.py, validacao.py, ficha_tecnica.py, equipamentos.py,
        vulnerabilidades.py, inventario.py, risco.py, armazenamento.py,
        migracao.py, repositorio_sql.py
ignore_missing_imports = True
check_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True
no_implicit_optional = True

[mypy-main,telas,arvore,atualizacao_cve,base_cve,formatacao,calculadora_cvss]
ignore_errors = True
