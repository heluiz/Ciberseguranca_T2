# Configuração do Alembic para o banco do terminal (repositorio_sql.py).
# A URL vem da variável INVENTARIO_BANCO, nunca deste arquivo (senha fora
# do repositório). Exemplos:
#   INVENTARIO_BANCO=sqlite:///dados/inventario.db alembic -c migracoes_sql/alembic.ini upgrade head
#   alembic -c migracoes_sql/alembic.ini history
[alembic]
script_location = %(here)s
prepend_sys_path = ..
