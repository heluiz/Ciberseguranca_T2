# Integração contínua: a cada push e a cada pull request, o GitHub roda
# as mesmas verificações feitas à mão antes de entregar.
#   - estilo: ruff (PEP 8 e PEP 257, configurado em ruff.toml);
#   - testes: python testes.py (inclui o autoteste de cada módulo);
#   - container: constrói a imagem do Dockerfile e roda, dentro dela, o
#     autoteste do modelo de risco (confere o NumPy instalado na imagem).
name: Verificação

on:
  push:
  pull_request:

# O token do workflow só lê o repositório (menor privilégio).
permissions:
  contents: read

jobs:
  estilo-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Instalar dependências
        run: pip install -r requirements.txt ruff
      - name: Estilo (PEP 8 e PEP 257)
        run: ruff check .
      - name: Testes
        run: python testes.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir a imagem
        run: docker build -t inventario:ci .
      - name: Autoteste do modelo de risco dentro da imagem
        run: docker run --rm --read-only inventario:ci python risco.py
