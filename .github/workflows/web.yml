name: Verificação web PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-not-production
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-not-production-abcdefghijklmnopqrstuvwxyz-1234567890
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ci-only-not-production
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python testes.py
      - run: pytest --cov=inventory --cov=academic --cov-fail-under=80
      - run: python manage.py makemigrations --check --dry-run
      - run: DJANGO_DEBUG=0 python manage.py check --deploy --fail-level WARNING
      - run: pip-audit -r requirements-web.txt
      - run: docker build -f Dockerfile.web -t sentinel-web:ci .
